<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Floating Notepad</title>
    <style>
        :root {
            color-scheme: light;
            --background: #f5f5f5;
            --surface: #f1f1f1;
            --text: #333;
            --muted: #787878;
            --border: #ccc;
            --control: #fff;
            --selection: #b3d4fc;
            --selection-text: #000;
            --accent: #4a90e2;
        }

        :root[data-theme="dark"] {
            color-scheme: dark;
            --background: #222;
            --surface: #202022;
            --text: #d5d5d5;
            --muted: #999;
            --border: #555;
            --control: #333;
            --selection: #4a90e2;
            --selection-text: #fff;
        }

        @media (prefers-color-scheme: dark) {
            :root[data-theme="system"] {
                color-scheme: dark;
                --background: #222;
                --surface: #202022;
                --text: #d5d5d5;
                --muted: #999;
                --border: #555;
                --control: #333;
                --selection: #4a90e2;
                --selection-text: #fff;
            }
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--background);
            color: var(--text);
            font: 14px -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
        }

        .toolbar {
            display: flex;
            min-height: 42px;
            align-items: center;
            gap: 8px;
            padding: 5px 8px;
            background: transparent;
            color: var(--muted);
        }

        button,
        input,
        select {
            color: var(--text);
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .heading-picker {
            position: relative;
            flex: 0 1 220px;
            min-width: 120px;
        }

        #headingToggle,
        .search input {
            width: 100%;
            min-height: 28px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: var(--control);
        }

        #headingToggle {
            overflow: hidden;
            padding: 4px 8px;
            text-align: left;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #headingMenu {
            position: absolute;
            z-index: 10;
            top: calc(100% + 4px);
            left: 0;
            display: none;
            width: max-content;
            min-width: 220px;
            max-width: min(420px, 80vw);
            max-height: 60vh;
            overflow: auto;
            padding: 4px;
            border: 1px solid var(--border);
            border-radius: 5px;
            background: var(--control);
            box-shadow: 0 4px 14px #0003;
        }

        #headingMenu.open {
            display: block;
        }

        #headingMenu button {
            display: block;
            width: 100%;
            overflow: hidden;
            padding: 6px 8px;
            border: 0;
            border-radius: 3px;
            background: transparent;
            text-align: left;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #headingMenu button:hover,
        #headingMenu button:focus {
            outline: 0;
            background: var(--accent);
            color: var(--selection-text);
        }

        .search {
            display: flex;
            flex: 1 1 160px;
            min-width: 80px;
            align-items: center;
            gap: 3px;
        }

        .toolbar-toggle {
            flex: 0 0 auto;
            min-height: 28px;
            padding: 4px 8px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: var(--control);
            color: var(--text);
            white-space: nowrap;
        }

        .toolbar-toggle:hover {
            border-color: var(--accent);
        }

        .toolbar-toggle[aria-pressed="true"] {
            border-color: var(--accent);
            background: var(--selection);
            color: var(--selection-text);
        }

        .search input {
            min-width: 0;
            padding: 4px 7px;
        }

        .icon-button,
        .font-controls button,
        #clearSearch {
            display: grid;
            min-width: 28px;
            min-height: 28px;
            place-items: center;
            padding: 2px 5px;
            border: 0;
            border-radius: 4px;
            background: transparent;
            color: var(--muted);
        }

        .icon-button:hover,
        .font-controls button:hover,
        #clearSearch:hover {
            background: var(--background);
            color: var(--text);
        }

        .icon-button[aria-pressed="true"] {
            background: var(--selection);
            color: var(--selection-text);
        }

        .icon-button svg {
            width: 18px;
            height: 18px;
        }

        .font-controls {
            display: flex;
            flex: 0 0 auto;
            align-items: center;
        }

        .font-controls button {
            font-size: 19px;
        }

        .theme-picker {
            display: flex;
            flex: 0 0 auto;
            align-items: center;
            gap: 5px;
            color: var(--muted);
            white-space: nowrap;
        }

        #themeMode {
            min-height: 28px;
            padding: 3px 7px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: var(--control);
            color: var(--text);
        }

        #themeMode:focus,
        #themeMode:hover {
            border-color: var(--accent);
        }

        #editorSurface {
            position: relative;
            flex: 1;
            min-height: 0;
            overflow: hidden;
            background: var(--background);
            --editor-font-size: 16px;
            --editor-line-height: 24px;
        }

        #editorDisplay,
        #editor {
            display: block;
            width: 100%;
            padding: 12px;
            padding-bottom: calc(12px + var(--typewriter-bottom-space, 0px));
            border: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
            font-size: var(--editor-font-size);
            font-weight: 400;
            line-height: var(--editor-line-height);
            tab-size: 4;
        }

        #editorDisplay {
            position: absolute;
            inset: 0 auto auto 0;
            z-index: 4;
            min-height: 100%;
            margin: 0;
            overflow: visible;
            color: var(--text);
            pointer-events: none;
            white-space: pre-wrap;
            overflow-wrap: break-word;
        }

        #editorDisplay .markdown-heading {
            display: inline-block;
            color: var(--accent);
            font-weight: 700;
            line-height: inherit;
            vertical-align: middle;
        }

        #editorDisplay .markdown-heading.level-1,
        #editorDisplay .markdown-heading.level-2 {
            text-decoration: underline;
            text-decoration-color: var(--border);
            text-underline-offset: 3px;
        }

        #editorDisplay .markdown-heading.level-1 {
            text-decoration-thickness: 2px;
        }

        #editorDisplay .folded-section-heading::after {
            color: var(--muted);
            content: " …";
            font-weight: 400;
        }

        #editorDisplay .section-heading-line {
            position: relative;
        }

        #editorDisplay .section-fold-button {
            position: absolute;
            left: -12px;
            top: 0;
            display: grid;
            width: 12px;
            height: var(--editor-line-height);
            place-items: center;
            padding: 0;
            border: 0;
            background: transparent;
            color: var(--muted);
            pointer-events: auto;
            font: inherit;
            line-height: 1;
        }

        #editorDisplay .section-fold-button::before {
            content: "▾";
        }

        #editorDisplay .section-fold-button.is-folded::before {
            content: "▸";
        }

        #editorDisplay .section-fold-button:focus-visible {
            outline: 1px solid var(--accent);
            border-radius: 2px;
        }

        #editorDisplay .markdown-marker {
            color: var(--muted);
            font-weight: 400;
        }

        #editorDisplay .markdown-strong {
            font-weight: 700;
        }

        #editorDisplay .markdown-underline {
            text-decoration: underline;
            text-underline-offset: 2px;
        }

        #editorDisplay .markdown-emphasis {
            font-style: italic;
        }

        #editorDisplay .markdown-strikethrough {
            text-decoration: line-through;
        }

        #editorDisplay .markdown-code {
            padding: 0 2px;
            border-radius: 3px;
            background: var(--surface);
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        }

        #editorDisplay .markdown-code-block {
            color: var(--muted);
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        }

        #editorDisplay .markdown-rule {
            color: var(--muted);
            text-decoration: line-through;
        }

        #editorDisplay .markdown-link {
            color: var(--accent);
            text-decoration: underline;
            text-decoration-style: dotted;
        }

        #editorDisplay .markdown-quote {
            color: var(--muted);
            border-left: 2px solid var(--border);
            padding-left: 5px;
        }

        #editorDisplay .fountain-scene-heading {
            color: var(--accent);
            font-weight: 700;
        }

        #editorDisplay .fountain-character {
            color: var(--accent);
            font-weight: 700;
            letter-spacing: 0.035em;
        }

        #editorDisplay .fountain-dialogue {
            color: var(--text);
        }

        #editorDisplay .fountain-parenthetical {
            color: var(--muted);
            font-style: italic;
        }

        #editorDisplay .fountain-transition {
            color: var(--muted);
            font-weight: 600;
        }

        #editorDisplay .fountain-centered {
            color: var(--accent);
            font-style: italic;
        }

        #editorDisplay .markdown-rule {
            color: var(--muted);
            text-decoration: line-through;
        }

        #editorDisplay .search-match {
            border-radius: 2px;
            background: #ffd966;
            color: #222;
        }

        #editorDisplay .search-match.active {
            background: #ff9f43;
            color: #111;
            box-shadow: 0 0 0 1px #d97706;
        }

        #editorDisplay .editor-selection {
            background: var(--selection);
            color: var(--selection-text);
        }

        #editorCaret {
            position: absolute;
            z-index: 3;
            display: none;
            width: 1px;
            background: var(--text);
            pointer-events: none;
            animation: caret-blink 1.06s steps(2, start) infinite;
        }

        @keyframes caret-blink {
            to { visibility: hidden; }
        }

        #editor {
            position: absolute;
            inset: 0;
            z-index: 2;
            height: 100%;
            resize: none;
            outline: 0;
            overflow: auto;
            background: transparent;
            color: transparent;
            caret-color: transparent;
            font-weight: 400;
            white-space: pre-wrap;
        }

        #editor::selection,
        input::selection {
            background: transparent;
            color: transparent;
        }

        .footer {
            display: flex;
            min-height: 32px;
            align-items: center;
            justify-content: flex-end;
            padding: 4px 10px;
            background: var(--background);
            color: var(--muted);
            font-size: 12px;
        }

        .instructions {
            opacity: 0;
            transition: opacity 150ms ease;
        }

        .hint-indicator {
            display: inline-flex;
            flex: 0 0 auto;
            align-items: center;
            color: var(--muted);
        }

        .hint-indicator svg {
            width: 14px;
            height: 14px;
        }

        .footer:hover .instructions,
        .instructions:focus-within {
            opacity: 1;
        }

        #status {
            margin-left: auto;
            padding-left: 10px;
        }

        @media (max-width: 520px) {
            .toolbar {
                flex-wrap: wrap;
            }

            .heading-picker {
                flex: 1 1 150px;
            }

            .search {
                order: 3;
                flex-basis: 100%;
            }

        }
    </style>
</head>
<body>
    <header class="toolbar">
        <div class="heading-picker">
            <button id="headingToggle" type="button" aria-haspopup="true" aria-expanded="false">Jump to heading ▾</button>
            <div id="headingMenu" role="menu" aria-label="Jump to heading"></div>
        </div>
        <button class="toolbar-toggle" id="typewriterToggle" type="button" aria-label="Typewriter mode" aria-pressed="true" title="Typewriter mode keeps the current line centered">
            Typewriter
        </button>
        <div class="search" role="search">
            <input id="searchInput" type="search" placeholder="Find…" aria-label="Find in notepad">
            <button class="icon-button" id="findPrevious" type="button" aria-label="Previous match" title="Previous match">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M15.4 7.4 14 6l-6 6 6 6 1.4-1.4-4.6-4.6z"/></svg>
            </button>
            <button class="icon-button" id="findNext" type="button" aria-label="Next match" title="Next match">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="m8.6 16.6 1.4 1.4 6-6-6-6-1.4 1.4 4.6 4.6z"/></svg>
            </button>
            <button id="clearSearch" type="button" aria-label="Clear search" title="Clear search">×</button>
        </div>

        <div class="font-controls" aria-label="Editor text size">
            <button id="decreaseFont" type="button" aria-label="Decrease text size">−</button>
            <button id="increaseFont" type="button" aria-label="Increase text size">+</button>
        </div>

        <label class="theme-picker">
            Theme
            <select id="themeMode" aria-label="Theme">
                <option value="beat">Beat</option>
                <option value="light">Light</option>
                <option value="dark">Dark</option>
            </select>
        </label>
    </header>

    <div id="editorSurface">
        <pre id="editorDisplay" aria-hidden="true"></pre>
        <textarea id="editor" wrap="soft" spellcheck="true" autocorrect="on" autocapitalize="sentences" aria-label="Beat notepad"></textarea>
        <div id="editorCaret" aria-hidden="true"></div>
    </div>

    <footer class="footer">
        <span class="hint-indicator" title="Hover here to show keyboard shortcuts" aria-label="Hover here to show keyboard shortcuts">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 10.5v5M12 7.5h.01" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.8"/></svg>
        </span>
        <span class="instructions">· ⌥⌘↑/↓: navigate dropdown · ⌥↑/↓: jump sections · ⌘↑: fold · ⌘↓: unfold · ⌥⌘3: show or hide</span>
        <span id="status" role="status" aria-live="polite"></span>
    </footer>

    <script>
        (() => {
            const editor = document.getElementById("editor");
            const searchInput = document.getElementById("searchInput");
            const headingToggle = document.getElementById("headingToggle");
            const headingMenu = document.getElementById("headingMenu");
            const typewriterToggle = document.getElementById("typewriterToggle");
            const status = document.getElementById("status");
            window.setBeatTheme = (theme, mode) => {
                if (!["system", "light", "dark"].includes(theme)) {
                    throw new TypeError("Unsupported Floating Notepad theme: " + theme);
                }
                if (!["beat", "system", "light", "dark"].includes(mode)) {
                    throw new TypeError("Unsupported Floating Notepad theme mode: " + mode);
                }
                document.documentElement.dataset.theme = theme;
                document.getElementById("themeMode").value = mode;
            };
            let matches = [];
            let activeMatch = -1;
            let fontSize = 16;
            let typewriterMode = true;
            let foldedSectionLine = null;
            let syncTimer = null;
            let lastSyncedText = null;
            let hasUnsyncedEdits = false;
            const undoHistory = [];
            let historyIndex = -1;
            let pendingHistorySnapshot = null;
            let pendingHistoryInputType = "";
            let lastHistoryEditTime = 0;
            let restoringHistory = false;

            function getLines() {
                return editor.value.split("\n");
            }

            function readHistorySnapshot() {
                return {
                    value: editor.value,
                    selectionStart: editor.selectionStart,
                    selectionEnd: editor.selectionEnd
                };
            }

            function snapshotsMatch(first, second) {
                return first.value === second.value &&
                    first.selectionStart === second.selectionStart &&
                    first.selectionEnd === second.selectionEnd;
            }

            function resetUndoHistory() {
                undoHistory.length = 0;
                undoHistory.push(readHistorySnapshot());
                historyIndex = 0;
                pendingHistorySnapshot = null;
                lastHistoryEditTime = 0;
            }

            function recordUndoHistory(inputType = "insertText") {
                if (restoringHistory) return;
                const current = readHistorySnapshot();
                if (historyIndex < 0) resetUndoHistory();
                const previous = undoHistory[historyIndex];
                if (snapshotsMatch(previous, current)) return;

                undoHistory.splice(historyIndex + 1);
                const now = Date.now();
                const canCoalesce = /^(insertText|deleteContentBackward|deleteContentForward)$/.test(inputType) &&
                    inputType === pendingHistoryInputType &&
                    pendingHistorySnapshot &&
                    pendingHistorySnapshot.selectionStart === pendingHistorySnapshot.selectionEnd &&
                    now - lastHistoryEditTime < 750 &&
                    historyIndex > 0;

                if (canCoalesce) {
                    undoHistory[historyIndex] = current;
                } else {
                    undoHistory.push(current);
                    historyIndex = undoHistory.length - 1;
                }

                if (undoHistory.length > 200) {
                    undoHistory.shift();
                    historyIndex -= 1;
                }
                lastHistoryEditTime = now;
                pendingHistorySnapshot = null;
                pendingHistoryInputType = "";
            }

            function restoreHistorySnapshot(snapshot) {
                window.clearTimeout(syncTimer);
                restoringHistory = true;
                editor.value = snapshot.value;
                editor.setSelectionRange(snapshot.selectionStart, snapshot.selectionEnd);
                restoringHistory = false;
                hasUnsyncedEdits = true;
                updateTypewriterPadding();
                updateEditorDisplay();
                updateHeadings();
                updateSearchMatches();
                scheduleSync();
            }

            function undoEdit() {
                if (historyIndex <= 0) return;
                historyIndex -= 1;
                restoreHistorySnapshot(undoHistory[historyIndex]);
            }

            function redoEdit() {
                if (historyIndex >= undoHistory.length - 1) return;
                historyIndex += 1;
                restoreHistorySnapshot(undoHistory[historyIndex]);
            }

            function handleUndoShortcut(event) {
                if (!event.metaKey || event.ctrlKey || event.altKey) return;
                const key = event.key.toLowerCase();
                if (key !== "z" && !(key === "y" && !event.shiftKey)) return;
                event.preventDefault();
                event.stopImmediatePropagation();
                if (key === "y" || event.shiftKey) redoEdit();
                else undoEdit();
            }

            function parseHeading(line) {
                const match = line.match(/^(#{1,6})([ \t]*)(.*)$/);
                if (!match) return null;
                const title = match[3];
                if (!title) return null;
                return {
                    level: match[1].length,
                    marker: match[1] + match[2],
                    title
                };
            }

            function isCharacterCue(line, followingLine) {
                const cue = line.trim();
                return /^[A-Z][A-Z0-9 .,'’()\-]*$/.test(cue) &&
                    /[A-Z]/.test(cue) &&
                    cue.length <= 40 &&
                    followingLine.trim().length > 0 &&
                    !parseHeading(followingLine) &&
                    !/^\s*(?:>|[-+*]\s+|\d+[.)]\s+)/.test(followingLine);
            }

            function classifyFountainLine(line, lineNumber, lines) {
                const trimmed = line.trim();
                if (!trimmed) return null;

                const centered = trimmed.match(/^>(.+)<$/);
                if (centered) return { type: "centered", text: centered[1].trim() };

                const transition = trimmed.replace(/^>\s*/, "");
                if (/^(?:[A-Z][A-Z0-9 .'-]* TO:|FADE (?:IN|OUT):?)$/.test(transition)) {
                    return { type: "transition", text: transition };
                }

                if (/^(?:INT\.|EXT\.|EST\.|INT\/EXT\.|INT\.\/EXT\.|I\/E\.)\s*\S/i.test(trimmed)) {
                    return { type: "scene-heading", text: line };
                }

                if (/^\(.*\)$/.test(trimmed)) {
                    return { type: "parenthetical", text: line };
                }

                const nextLine = lines[lineNumber + 1] || "";
                if (isCharacterCue(line, nextLine)) return { type: "character", text: line };

                return null;
            }

            function updateEditorDisplay() {
                const fragment = document.createDocumentFragment();
                let lineOffset = 0;
                let inCodeFence = false;
                let inDialogue = false;
                const lines = getLines();
                const sections = findSections(lines);
                const sectionsByLine = new Map(sections.map((section) => [section.lineNumber, section]));
                const foldedSection = sections.find((section) => section.lineNumber === foldedSectionLine);
                const trailingBlankLines = foldedSection
                    ? getFoldedTrailingBlankLines(foldedSection, lines)
                    : 0;
                lines.forEach((line, lineNumber) => {
                    const isFolded = foldedSection &&
                        lineNumber > foldedSection.lineNumber &&
                        lineNumber < foldedSection.endLine;
                    const fence = line.match(/^(\s*```.*)$/);
                    if (isFolded) {
                        if (fence) inCodeFence = !inCodeFence;
                        if (!line.trim()) inDialogue = false;
                        lineOffset += line.length + 1;
                        return;
                    }

                    const renderedLine = document.createElement("div");
                    renderedLine.dataset.lineNumber = String(lineNumber);
                    const heading = parseHeading(line);
                    const fountain = classifyFountainLine(line, lineNumber, lines);
                    const quote = line.match(/^(\s*&gt;|\s*> ?)(.*)$/);
                    const list = line.match(/^(\s*(?:[-+*]|\d+[.)])\s+)(.*)$/);
                    const rule = /^\s*(?:(?:-{3,})|(?:\*{3,})|(?:_{3,}))\s*$/.test(line);
                    const section = sectionsByLine.get(lineNumber);
                    if (section) {
                        renderedLine.classList.add("section-heading-line");
                        if (foldedSection && lineNumber === foldedSection.lineNumber) {
                            renderedLine.classList.add("folded-section-heading");
                        }
                    }

                    if (!line.trim()) {
                        inDialogue = false;
                    }

                    if (fence) {
                        inDialogue = false;
                        appendHighlightedText(renderedLine, line, lineOffset, "markdown-marker");
                        inCodeFence = !inCodeFence;
                    } else if (inCodeFence) {
                        appendHighlightedText(renderedLine, line || "\u00a0", lineOffset, "markdown-code-block");
                    } else if (fountain && fountain.type === "centered") {
                        inDialogue = false;
                        appendHighlightedText(renderedLine, ">", lineOffset, "markdown-marker");
                        appendInlineMarkdown(renderedLine, fountain.text, lineOffset + 1, "fountain-centered");
                        appendHighlightedText(renderedLine, "<", lineOffset + line.length - 1, "markdown-marker");
                    } else if (fountain && fountain.type === "transition") {
                        inDialogue = false;
                        appendHighlightedText(renderedLine, line, lineOffset, "fountain-transition");
                    } else if (fountain && fountain.type === "scene-heading") {
                        inDialogue = false;
                        appendInlineMarkdown(renderedLine, fountain.text, lineOffset, "fountain-scene-heading");
                    } else if (heading) {
                        inDialogue = false;
                        const marker = document.createElement("span");
                        marker.className = "markdown-marker";
                        appendHighlightedText(marker, heading.marker, lineOffset, "markdown-marker");
                        const title = document.createElement("span");
                        title.className = `markdown-heading level-${heading.level}`;
                        appendInlineMarkdown(title, heading.title, lineOffset + heading.marker.length);
                        renderedLine.append(marker, title);
                    } else if (quote) {
                        inDialogue = false;
                        appendHighlightedText(renderedLine, quote[1], lineOffset, "markdown-marker");
                        const quoteText = document.createElement("span");
                        quoteText.className = "markdown-quote";
                        appendInlineMarkdown(quoteText, quote[2], lineOffset + quote[1].length);
                        renderedLine.appendChild(quoteText);
                    } else if (fountain && fountain.type === "character") {
                        inDialogue = true;
                        appendHighlightedText(renderedLine, line, lineOffset, "fountain-character");
                    } else if (fountain && fountain.type === "parenthetical" && inDialogue) {
                        appendInlineMarkdown(renderedLine, line, lineOffset, "fountain-parenthetical");
                    } else if (inDialogue && !list && !rule) {
                        appendInlineMarkdown(renderedLine, line, lineOffset, "fountain-dialogue");
                    } else if (fountain && fountain.type === "parenthetical") {
                        appendInlineMarkdown(renderedLine, line, lineOffset);
                    } else if (list) {
                        inDialogue = false;
                        appendHighlightedText(renderedLine, list[1], lineOffset, "markdown-marker");
                        appendInlineMarkdown(renderedLine, list[2], lineOffset + list[1].length);
                    } else if (rule) {
                        inDialogue = false;
                        appendHighlightedText(renderedLine, line, lineOffset, "markdown-rule");
                    } else {
                        appendInlineMarkdown(renderedLine, line || "\u00a0", lineOffset);
                    }
                    if (section) {
                        const isFolded = foldedSectionLine === section.lineNumber;
                        const foldButton = document.createElement("button");
                        foldButton.type = "button";
                        foldButton.className = "section-fold-button";
                        foldButton.classList.toggle("is-folded", isFolded);
                        foldButton.setAttribute("aria-label", `${isFolded ? "Expand" : "Collapse"} ${section.label.trim()}`);
                        foldButton.setAttribute("aria-expanded", String(!isFolded));
                        foldButton.title = `${isFolded ? "Expand" : "Collapse"} section`;
                        foldButton.addEventListener("pointerdown", (event) => event.preventDefault());
                        foldButton.addEventListener("click", (event) => {
                            event.stopPropagation();
                            toggleSectionFold(section.lineNumber);
                        });
                        renderedLine.appendChild(foldButton);
                    }
                    fragment.appendChild(renderedLine);
                    if (foldedSection && lineNumber === foldedSection.lineNumber) {
                        for (let index = 0; index < trailingBlankLines; index += 1) {
                            const spacer = document.createElement("div");
                            spacer.className = "folded-section-spacer";
                            spacer.textContent = "\u00a0";
                            fragment.appendChild(spacer);
                        }
                    }
                    lineOffset += line.length + 1;
                });
                document.getElementById("editorDisplay").replaceChildren(fragment);
                clampFoldedScroll();
                syncEditorDisplayScroll();
                updateCustomCaret();
            }

            function appendInlineMarkdown(parent, text, sourceOffset, styleClass = "") {
                const tokenPattern = /\*\*\*(.+?)\*\*\*|(\*\*|__)(.+?)\2|~~(.+?)~~|`([^`]+)`|\[([^\]]+)\]\(([^)]+)\)|(\*|_)([^*_]+?)\8/g;
                let cursor = 0;
                let token;
                while ((token = tokenPattern.exec(text)) !== null) {
                    appendHighlightedText(parent, text.slice(cursor, token.index), sourceOffset + cursor, styleClass);
                    const tokenStart = sourceOffset + token.index;
                    const tokenEnd = tokenStart + token[0].length;
                    if (token[1] !== undefined) {
                        appendHighlightedText(parent, "***", tokenStart, "markdown-marker");
                        appendHighlightedText(parent, token[1], tokenStart + 3, `${styleClass} markdown-strong markdown-emphasis`);
                        appendHighlightedText(parent, "***", tokenEnd - 3, "markdown-marker");
                    } else if (token[3] !== undefined) {
                        const marker = token[2];
                        const contentClass = "markdown-strong";
                        appendHighlightedText(parent, marker, tokenStart, "markdown-marker");
                        appendHighlightedText(parent, token[3], tokenStart + marker.length, `${styleClass} ${contentClass}`);
                        appendHighlightedText(parent, marker, tokenEnd - marker.length, "markdown-marker");
                    } else if (token[4] !== undefined) {
                        appendHighlightedText(parent, "~~", tokenStart, "markdown-marker");
                        appendHighlightedText(parent, token[4], tokenStart + 2, `${styleClass} markdown-strikethrough`);
                        appendHighlightedText(parent, "~~", tokenEnd - 2, "markdown-marker");
                    } else if (token[5] !== undefined) {
                        appendHighlightedText(parent, "`", tokenStart, "markdown-marker");
                        appendHighlightedText(parent, token[5], tokenStart + 1, `${styleClass} markdown-code`);
                        appendHighlightedText(parent, "`", tokenEnd - 1, "markdown-marker");
                    } else if (token[6] !== undefined) {
                        const destinationStart = tokenStart + token[0].indexOf("](");
                        appendHighlightedText(parent, "[", tokenStart, "markdown-marker");
                        appendHighlightedText(parent, token[6], tokenStart + 1, `${styleClass} markdown-link`);
                        appendHighlightedText(parent, token[0].slice(token[0].indexOf("](")), destinationStart, "markdown-marker");
                    } else {
                        const marker = token[8];
                        const contentClass = marker === "*"
                            ? "markdown-emphasis"
                            : "markdown-underline";
                        appendHighlightedText(parent, marker, tokenStart, "markdown-marker");
                        appendHighlightedText(parent, token[9], tokenStart + 1, `${styleClass} ${contentClass}`);
                        appendHighlightedText(parent, marker, tokenEnd - 1, "markdown-marker");
                    }
                    cursor = token.index + token[0].length;
                }
                appendHighlightedText(parent, text.slice(cursor), sourceOffset + cursor, styleClass);
            }

            function appendHighlightedText(parent, text, sourceOffset, styleClass = "") {
                if (!text) return;
                const textEnd = sourceOffset + text.length;
                const selectedStart = editor.selectionStart;
                const selectedEnd = editor.selectionEnd;
                const showSelection = document.activeElement === editor && selectedStart !== selectedEnd;
                const boundaries = new Set([sourceOffset, textEnd]);
                if (showSelection && selectedStart < textEnd && selectedEnd > sourceOffset) {
                    boundaries.add(Math.max(sourceOffset, selectedStart));
                    boundaries.add(Math.min(textEnd, selectedEnd));
                }
                for (const match of matches) {
                    if (match.start < textEnd && match.end > sourceOffset) {
                        boundaries.add(Math.max(sourceOffset, match.start));
                        boundaries.add(Math.min(textEnd, match.end));
                    }
                }
                const sortedBoundaries = [...boundaries].sort((first, second) => first - second);
                for (let index = 0; index < sortedBoundaries.length - 1; index += 1) {
                    const start = sortedBoundaries[index];
                    const end = sortedBoundaries[index + 1];
                    if (start === end) continue;
                    const match = matches.find((candidate) => candidate.start <= start && candidate.end >= end);
                    const selected = showSelection && selectedStart < end && selectedEnd > start;
                    const extraClasses = [];
                    if (match) {
                        extraClasses.push(match.index === activeMatch ? "search-match active" : "search-match");
                    }
                    if (selected) extraClasses.push("editor-selection");
                    const classNames = [styleClass, ...extraClasses].filter(Boolean).join(" ");
                    const segment = text.slice(start - sourceOffset, end - sourceOffset);
                    if (classNames) {
                        const span = document.createElement("span");
                        span.className = classNames;
                        span.textContent = segment;
                        parent.appendChild(span);
                    } else {
                        parent.appendChild(document.createTextNode(segment));
                    }
                }
            }

            function syncEditorDisplayScroll() {
                const display = document.getElementById("editorDisplay");
                display.style.transform = `translate(${-editor.scrollLeft}px, ${-editor.scrollTop}px)`;
            }

            function clampFoldedScroll() {
                if (foldedSectionLine === null) return;
                const display = document.getElementById("editorDisplay");
                const maxScrollTop = Math.max(0, display.scrollHeight - editor.clientHeight);
                if (editor.scrollTop > maxScrollTop) editor.scrollTop = maxScrollTop;
            }

            function getFoldedTrailingBlankLines(section, lines) {
                if (section.endLine >= lines.length) return 0;
                let count = 0;
                for (let lineNumber = section.endLine - 1;
                    lineNumber > section.lineNumber && !lines[lineNumber].trim();
                    lineNumber -= 1) {
                    count += 1;
                }
                return Math.max(1, count);
            }

            function updateCustomCaret() {
                const caret = document.getElementById("editorCaret");
                if (document.activeElement !== editor || editor.selectionStart !== editor.selectionEnd) {
                    caret.style.display = "none";
                    return;
                }

                const display = document.getElementById("editorDisplay");
                const lines = getLines();
                const caretLineNumber = currentLineNumber();
                const lineElement = display.querySelector(`[data-line-number="${caretLineNumber}"]`);
                if (!lineElement) {
                    caret.style.display = "none";
                    return;
                }
                const localOffset = Math.max(
                    0,
                    Math.min(
                        lines[caretLineNumber].length,
                        editor.selectionStart - lineStart(caretLineNumber)
                    )
                );

                const walker = document.createTreeWalker(lineElement, NodeFilter.SHOW_TEXT);
                let textNode;
                let consumed = 0;
                let range = document.createRange();
                while ((textNode = walker.nextNode())) {
                    if (localOffset <= consumed + textNode.length) {
                        range.setStart(textNode, localOffset - consumed);
                        range.collapse(true);
                        break;
                    }
                    consumed += textNode.length;
                }
                if (!textNode) {
                    range.setStart(lineElement, lineElement.childNodes.length);
                    range.collapse(true);
                }

                let rect = range.getBoundingClientRect();
                if (!rect.height) rect = lineElement.getBoundingClientRect();
                const surfaceRect = document.getElementById("editorSurface").getBoundingClientRect();
                const lineHeight = Number.parseFloat(getComputedStyle(editor).lineHeight) || fontSize * 1.5;
                const top = rect.top - surfaceRect.top;
                const left = rect.left - surfaceRect.left;
                caret.style.left = `${left}px`;
                caret.style.top = `${top}px`;
                caret.style.height = `${rect.height || lineHeight}px`;
                caret.style.display = "block";
            }

            function findSections(lines = getLines()) {
                const sections = [];
                let inCodeFence = false;
                lines.forEach((line, lineNumber) => {
                    if (/^\s*```/.test(line)) {
                        inCodeFence = !inCodeFence;
                        return;
                    }
                    if (inCodeFence) return;

                    const heading = parseHeading(line);
                    if (heading) {
                        sections.push({
                            lineNumber,
                            level: heading.level,
                            label: `${heading.marker}${heading.title.replace(/[ \t]+#+[ \t]*$/, "").trim()}`
                        });
                        return;
                    }

                    const fountain = classifyFountainLine(line, lineNumber, lines);
                    if (fountain && fountain.type === "scene-heading") {
                        sections.push({
                            lineNumber,
                            level: 1,
                            label: fountain.text.trim()
                        });
                    }
                });

                const openSections = [];
                sections.forEach((section) => {
                    section.endLine = lines.length;
                    while (openSections.length &&
                        openSections[openSections.length - 1].level >= section.level) {
                        openSections.pop().endLine = section.lineNumber;
                    }
                    openSections.push(section);
                });
                return sections;
            }

            function findHeadings() {
                return findSections();
            }

            function sectionAtLine(lineNumber) {
                const sections = findSections();
                for (let index = sections.length - 1; index >= 0; index -= 1) {
                    if (sections[index].lineNumber <= lineNumber) return sections[index];
                }
                return null;
            }

            function clearFoldedSection() {
                if (foldedSectionLine === null) return;
                foldedSectionLine = null;
                updateEditorDisplay();
            }

            function toggleSectionFold(sectionLine = sectionAtLine(currentLineNumber())?.lineNumber) {
                if (sectionLine === undefined || sectionLine === null) return;
                if (foldedSectionLine !== null) {
                    if (foldedSectionLine === sectionLine) {
                        foldedSectionLine = null;
                        updateEditorDisplay();
                        return;
                    }
                }

                foldedSectionLine = sectionLine;
                scrollToOffset(lineStart(sectionLine));
                updateEditorDisplay();
            }

            function updateHeadings() {
                headingMenu.replaceChildren();
                const headings = findSections();
                if (!headings.length) {
                    const empty = document.createElement("div");
                    empty.textContent = "No headings found";
                    empty.style.padding = "6px 8px";
                    headingMenu.appendChild(empty);
                    return;
                }

                headings.forEach((heading) => {
                    const item = document.createElement("button");
                    item.type = "button";
                    item.setAttribute("role", "menuitem");
                    item.textContent = heading.label;
                    item.style.paddingLeft = `${8 + (heading.level - 1) * 14}px`;
                    item.addEventListener("click", () => jumpToLine(heading.lineNumber));
                    headingMenu.appendChild(item);
                });
            }

            function setEditorText(text, preserveSelection = true) {
                if (editor.value === text) return false;
                foldedSectionLine = null;
                const start = preserveSelection ? editor.selectionStart : 0;
                const end = preserveSelection ? editor.selectionEnd : 0;
                const scrollTop = editor.scrollTop;
                editor.value = text;
                editor.setSelectionRange(Math.min(start, text.length), Math.min(end, text.length));
                editor.scrollTop = scrollTop;
                if (searchInput.value) updateSearchMatches(false);
                updateEditorDisplay();
                updateHeadings();
                keepCaretCentered();
                return true;
            }

            window.refreshFloatingNotepad = (text) => {
                if (hasUnsyncedEdits && text !== editor.value) return;
                const changed = setEditorText(text || "");
                if (changed) resetUndoHistory();
                lastSyncedText = text || "";
                hasUnsyncedEdits = false;
                updateHeadings();
            };

            function syncToBeat() {
                const text = editor.value;
                if (text === lastSyncedText) {
                    hasUnsyncedEdits = false;
                    return;
                }
                lastSyncedText = text;
                hasUnsyncedEdits = false;
                Beat.call(
                    (content) => Beat.custom.syncNotepad(content),
                    text
                );
            }

            function scheduleSync() {
                window.clearTimeout(syncTimer);
                syncTimer = window.setTimeout(syncToBeat, 250);
            }

            function requestNotepad() {
                Beat.callback(
                    () => Beat.notepad.string,
                    (text) => {
                        if (!hasUnsyncedEdits) {
                            const changed = setEditorText(text || "");
                            if (changed || historyIndex < 0) resetUndoHistory();
                            lastSyncedText = text || "";
                            hasUnsyncedEdits = false;
                        }
                        updateHeadings();
                    }
                );
            }

            function lineStart(lineNumber) {
                const lines = getLines();
                let offset = 0;
                for (let index = 0; index < lineNumber && index < lines.length; index += 1) {
                    offset += lines[index].length + 1;
                }
                return offset;
            }

            function scrollToOffset(offset, verticalPosition = 0.35) {
                const surface = document.getElementById("editorSurface");
                const mirror = document.createElement("div");
                const marker = document.createElement("span");
                const style = window.getComputedStyle(editor);
                const prefix = document.createTextNode(editor.value.slice(0, offset));

                mirror.setAttribute("aria-hidden", "true");
                Object.assign(mirror.style, {
                    position: "absolute",
                    top: "0",
                    left: "0",
                    width: `${editor.clientWidth}px`,
                    padding: style.padding,
                    border: "0",
                    boxSizing: "border-box",
                    visibility: "hidden",
                    whiteSpace: "pre-wrap",
                    overflowWrap: "break-word",
                    font: style.font,
                    lineHeight: style.lineHeight,
                    letterSpacing: style.letterSpacing,
                    tabSize: style.tabSize
                });
                Object.assign(marker.style, {
                    display: "inline-block",
                    width: "0",
                    height: style.lineHeight,
                    verticalAlign: "top"
                });
                mirror.append(prefix, marker);
                surface.appendChild(mirror);
                const offsetTop = marker.getBoundingClientRect().top - surface.getBoundingClientRect().top;
                mirror.remove();

                const targetTop = Math.max(0, offsetTop - editor.clientHeight * verticalPosition);
                editor.scrollTop = Math.min(targetTop, editor.scrollHeight - editor.clientHeight);
                syncEditorDisplayScroll();
            }

            function keepCaretCentered() {
                if (typewriterMode) scrollToOffset(editor.selectionStart, 0.5);
            }

            function updateTypewriterPadding() {
                const surface = document.getElementById("editorSurface");
                const extraSpace = typewriterMode ? editor.clientHeight / 2 : 0;
                surface.style.setProperty("--typewriter-bottom-space", `${extraSpace}px`);
                if (!typewriterMode) {
                    editor.scrollTop = Math.min(
                        editor.scrollTop,
                        Math.max(0, editor.scrollHeight - editor.clientHeight)
                    );
                }
                updateEditorDisplay();
                keepCaretCentered();
            }

            function jumpToLine(lineNumber) {
                closeHeadingMenu();
                clearFoldedSection();
                const offset = lineStart(lineNumber);
                editor.focus();
                editor.setSelectionRange(offset, offset);
                updateEditorDisplay();
                scrollToOffset(offset);
                keepCaretCentered();
            }

            function currentLineNumber() {
                return editor.value.slice(0, editor.selectionStart).split("\n").length - 1;
            }

            function jumpRelative(direction) {
                const headings = findHeadings();
                if (!headings.length) return;
                const current = currentLineNumber();
                let target;
                if (direction > 0) {
                    target = headings.find((heading) => heading.lineNumber > current) || headings[0];
                } else {
                    target = [...headings].reverse().find((heading) => heading.lineNumber < current) || headings[headings.length - 1];
                }
                jumpToLine(target.lineNumber);
            }

            function openHeadingMenu() {
                updateHeadings();
                headingMenu.classList.add("open");
                headingToggle.setAttribute("aria-expanded", "true");
                const first = headingMenu.querySelector("button");
                if (first) first.focus();
            }

            function closeHeadingMenu(focusToggle = false) {
                headingMenu.classList.remove("open");
                headingToggle.setAttribute("aria-expanded", "false");
                if (focusToggle) headingToggle.focus();
            }

            function toggleHeadingMenu() {
                if (headingMenu.classList.contains("open")) {
                    closeHeadingMenu();
                } else {
                    openHeadingMenu();
                }
            }

            function updateSearchMatches(resetIndex = true) {
                clearFoldedSection();
                const query = searchInput.value;
                matches = [];
                if (resetIndex) activeMatch = -1;
                if (!query) {
                    status.textContent = "";
                    updateEditorDisplay();
                    return;
                }

                const text = editor.value.toLocaleLowerCase();
                const needle = query.toLocaleLowerCase();
                let offset = 0;
                while ((offset = text.indexOf(needle, offset)) !== -1) {
                    matches.push({ start: offset, end: offset + query.length, index: matches.length });
                    offset += Math.max(1, query.length);
                }
                status.textContent = matches.length ? `${matches.length} found` : "No matches";
                updateEditorDisplay();
            }

            function navigateSearch(direction) {
                if (!searchInput.value) return;
                updateSearchMatches(false);
                if (!matches.length) return;
                activeMatch = activeMatch < 0
                    ? (direction > 0 ? 0 : matches.length - 1)
                    : (activeMatch + direction + matches.length) % matches.length;
                const match = matches[activeMatch];
                editor.setSelectionRange(match.start, match.end);
                scrollToOffset(match.start);
                keepCaretCentered();
                updateEditorDisplay();
                status.textContent = `${activeMatch + 1} of ${matches.length}`;
            }

            function applyMarkdownShortcut(opening, closing = opening, selectionPlaceholder = "text") {
                const start = editor.selectionStart;
                const end = editor.selectionEnd;
                const selectedText = editor.value.slice(start, end);
                const innerText = selectedText || selectionPlaceholder;
                const replacement = `${opening}${innerText}${closing}`;

                pendingHistorySnapshot = readHistorySnapshot();
                pendingHistoryInputType = "format";
                editor.setRangeText(replacement, start, end, "select");
                const innerStart = start + opening.length;
                editor.setSelectionRange(innerStart, innerStart + innerText.length);
                editor.focus();
                editor.dispatchEvent(new Event("input", { bubbles: true }));
            }

            function handleFormattingShortcut(event) {
                if (!event.metaKey || event.ctrlKey || event.altKey) return;
                if (event.key.toLowerCase() === "b" && event.shiftKey) {
                    event.preventDefault();
                    event.stopPropagation();
                    applyMarkdownShortcut("***");
                } else if (event.key.toLowerCase() === "u") {
                    event.preventDefault();
                    event.stopPropagation();
                    applyMarkdownShortcut("_");
                } else if (event.key.toLowerCase() === "b" && !event.shiftKey) {
                    event.preventDefault();
                    event.stopPropagation();
                    applyMarkdownShortcut("**");
                } else if (event.key === "i" && !event.shiftKey) {
                    event.preventDefault();
                    event.stopPropagation();
                    applyMarkdownShortcut("*");
                } else if (event.key.toLowerCase() === "x" && event.shiftKey) {
                    event.preventDefault();
                    event.stopPropagation();
                    applyMarkdownShortcut("~~");
                } else if (event.key.toLowerCase() === "c" && event.shiftKey) {
                    event.preventDefault();
                    event.stopPropagation();
                    applyMarkdownShortcut("`");
                } else if (event.key.toLowerCase() === "k" && !event.shiftKey) {
                    event.preventDefault();
                    event.stopPropagation();
                    applyMarkdownShortcut("[", "](url)");
                }
            }

            function clearSearch() {
                searchInput.value = "";
                matches = [];
                activeMatch = -1;
                status.textContent = "";
                updateEditorDisplay();
                searchInput.focus();
            }

            editor.addEventListener("input", () => {
                foldedSectionLine = null;
                recordUndoHistory(pendingHistoryInputType || "insertText");
                hasUnsyncedEdits = true;
                updateHeadings();
                updateSearchMatches();
                scheduleSync();
                keepCaretCentered();
            });
            editor.addEventListener("beforeinput", (event) => {
                if (event.inputType === "historyUndo" || event.inputType === "historyRedo") {
                    event.preventDefault();
                    event.stopImmediatePropagation();
                    if (event.inputType === "historyUndo") undoEdit();
                    else redoEdit();
                    return;
                }
                pendingHistorySnapshot = readHistorySnapshot();
                pendingHistoryInputType = event.inputType || "insertText";
            }, true);
            editor.addEventListener("keydown", handleUndoShortcut, true);
            editor.addEventListener("keydown", handleFormattingShortcut, true);
            editor.addEventListener("scroll", () => {
                clampFoldedScroll();
                syncEditorDisplayScroll();
                updateCustomCaret();
            });
            ["select", "keyup", "click", "focus", "blur"].forEach((eventName) => {
                editor.addEventListener(eventName, () => {
                    updateEditorDisplay();
                    keepCaretCentered();
                });
            });
            const systemDarkMode = window.matchMedia("(prefers-color-scheme: dark)");
            Beat.call((isDark) => Beat.custom.setSystemDarkMode(isDark), systemDarkMode.matches);
            systemDarkMode.addEventListener("change", (event) => {
                Beat.call((isDark) => Beat.custom.setSystemDarkMode(isDark), event.matches);
            });
            Beat.call(() => Beat.custom.editorReady());
            document.getElementById("headingToggle").addEventListener("click", toggleHeadingMenu);
            typewriterToggle.addEventListener("pointerdown", (event) => event.preventDefault());
            typewriterToggle.addEventListener("click", () => {
                typewriterMode = !typewriterMode;
                typewriterToggle.setAttribute("aria-pressed", String(typewriterMode));
                updateTypewriterPadding();
            });
            window.addEventListener("resize", updateTypewriterPadding);
            document.getElementById("themeMode").addEventListener("change", (event) => {
                Beat.call((mode) => Beat.custom.setThemeMode(mode), event.target.value);
            });
            document.getElementById("findPrevious").addEventListener("click", () => navigateSearch(-1));
            document.getElementById("findNext").addEventListener("click", () => navigateSearch(1));
            document.getElementById("clearSearch").addEventListener("click", clearSearch);
            document.getElementById("increaseFont").addEventListener("click", () => {
                fontSize = Math.min(40, fontSize + 2);
                const surface = document.getElementById("editorSurface");
                surface.style.setProperty("--editor-font-size", `${fontSize}px`);
                surface.style.setProperty("--editor-line-height", `${fontSize * 1.5}px`);
                updateEditorDisplay();
            });
            document.getElementById("decreaseFont").addEventListener("click", () => {
                fontSize = Math.max(10, fontSize - 2);
                const surface = document.getElementById("editorSurface");
                surface.style.setProperty("--editor-font-size", `${fontSize}px`);
                surface.style.setProperty("--editor-line-height", `${fontSize * 1.5}px`);
                updateEditorDisplay();
            });
            searchInput.addEventListener("input", () => updateSearchMatches());
            searchInput.addEventListener("keydown", (event) => {
                if (event.key === "Enter") {
                    event.preventDefault();
                    event.stopImmediatePropagation();
                    navigateSearch(event.shiftKey ? -1 : 1);
                } else if (event.key === "Escape") {
                    clearSearch();
                }
            }, true);
            document.addEventListener("click", (event) => {
                if (!event.target.closest(".heading-picker")) closeHeadingMenu();
            });

            window.addEventListener("keydown", (event) => {
                if (event.metaKey && event.ctrlKey && event.key === "0") {
                    event.preventDefault();
                    Beat.call(() => Beat.custom.toggleLightDark());
                    return;
                }

                if (document.activeElement === editor &&
                    event.metaKey && !event.altKey && !event.ctrlKey && !event.shiftKey &&
                    (event.key === "ArrowUp" || event.key === "ArrowDown")) {
                    event.preventDefault();
                    if (event.key === "ArrowUp") {
                        const section = sectionAtLine(currentLineNumber());
                        if (section && foldedSectionLine !== section.lineNumber) {
                            foldedSectionLine = section.lineNumber;
                            scrollToOffset(lineStart(section.lineNumber));
                            updateEditorDisplay();
                        }
                    } else if (foldedSectionLine !== null) {
                        clearFoldedSection();
                    }
                    return;
                }

                if (headingMenu.classList.contains("open")) {
                    const items = Array.from(headingMenu.querySelectorAll("button"));
                    const index = items.indexOf(document.activeElement);
                    if ((event.key === "ArrowDown" || event.key === "ArrowUp") && items.length) {
                        event.preventDefault();
                        const delta = event.key === "ArrowDown" ? 1 : -1;
                        items[(index + delta + items.length) % items.length].focus();
                        return;
                    }
                    if (event.key === "Enter" && index >= 0) {
                        event.preventDefault();
                        items[index].click();
                        return;
                    }
                    if (event.key === "Escape") {
                        event.preventDefault();
                        closeHeadingMenu(true);
                        return;
                    }
                }

                if (event.metaKey && event.altKey && !event.ctrlKey && !event.shiftKey &&
                    (event.key === "/" || event.key === "ArrowUp" || event.key === "ArrowDown")) {
                    event.preventDefault();
                    if (headingMenu.classList.contains("open")) closeHeadingMenu();
                    else openHeadingMenu();
                    return;
                }

                if (document.activeElement === editor && event.altKey && !event.metaKey && !event.ctrlKey && !event.shiftKey) {
                    if (event.key === "ArrowDown" || event.key === "ArrowUp") {
                        event.preventDefault();
                        jumpRelative(event.key === "ArrowDown" ? 1 : -1);
                    }
                }
            });

            updateEditorDisplay();
            updateHeadings();
            requestNotepad();
            window.addEventListener("focus", requestNotepad);
        })();
    </script>
</body>
</html>
